[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "compass"
version = "0.1.0"
description = "Track a registered personal object through hands, covers and lookalikes"
requires-python = ">=3.11"
# Runtime dependencies (torch, opencv, timm, ...) come from environment.yml; models from scripts/setup_third_party.sh.

[project.scripts]
compass-live = "compass.live:main"

[tool.setuptools.packages.find]
include = ["compass*"]
