# conda env create -f environment.yml && conda activate compass
# then: bash scripts/setup_third_party.sh   (SAM 2 + EdgeTAM at pinned commits, patch, checkpoints)
# then: pip install -e .                      (the compass package; then `python -m compass.live` works anywhere)
# EdgeTAM is not installed (its package is also named `sam2`); scripts put third_party/EdgeTAM on sys.path.
name: compass
channels: [defaults]
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch
      - torchvision
      - opencv-python
      - numpy
      - pillow
      - matplotlib
      - timm
      - imageio-ffmpeg   # bundled ffmpeg: re-encodes videos so Safari can play them
